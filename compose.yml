services:

  windowscomputer:
    container_name: windowscomputer
    image: lukaskellerstein/windows-computer:0.0.2
    environment:
      BOOT_MODE: "windows_plain"
      DEBUG: "y"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389/tcp
      - 3389:3389/udp
      - 5050:5050
      - 5051:5051
      - 5052:5052
      - 5053:5053
      - 9222:9222
    volumes:
      - ./computers/windows/docker/iso/win.iso:/custom.iso
      - ./computers/windows/docker/scripts:/oem
      - ./computers/windows/docker/storage:/storage
      - ./computers/windows/docker/data:/data
      - ./servers/server_browser_control:/data/server_browser_control
      - ./servers/server_computer_control:/data/server_computer_control
      - ./servers/server_evaluator:/data/server_evaluator
      - ./servers/server_network_proxy:/data/server_network_proxy
    restart: always
    stop_grace_period: 2m
    networks:
      - default

  omniparser-server:
    build:
      context: ./servers/server_omniparser
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    networks:
      - default

  agent-oo1:
    build:
      context: ./agents
      dockerfile: ./agent_oo1/Dockerfile
    environment:
      COMPUTER_CONTROL_URL: http://windowscomputer:5050
      BROWSER_CONTROL_URL: http://windowscomputer:5051
      OMNIPARSER_URL: http://omniparser-server:8000
      OLLAMA_URL: http://0.0.0.0:11434
      ANTHROPIC_API_KEY: <API_KEY>
      OPENAI_API_KEY: <API_KEY>
      AZURE_OPENAI_API_VERSION: 2025-01-01-preview
      AZURE_OPENAI_BASEURL: https://oo-openai-1.openai.azure.com/
      AZURE_API_KEY: <API_KEY>
    networks:
      - default

networks:
  default:
