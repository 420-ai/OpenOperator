  omniparserserver:
    container_name: omniparser-server
    image: lukaskellerstein/omniparser-server:0.0.2
    # build:
    #   context: ./servers/server_omniparser
    #   dockerfile: Dockerfile
    ports:
      - 8000:8000
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthcheck || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 20
    networks:
      - default

