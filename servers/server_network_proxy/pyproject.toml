[project]
name = "server-network-proxy"
version = "0.1.0"
description = "A simple MITM proxy server. It can be used to intercept and modify HTTP and HTTPS traffic."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "elasticsearch>=9.0.0",
    "fastapi>=0.115.11",
    "mitmproxy>=11.1.3",
    "pydantic>=2.10.6",
    "python-dotenv>=1.1.0",
    "setproctitle>=1.3.6",
    "uvicorn>=0.34.0",
]
