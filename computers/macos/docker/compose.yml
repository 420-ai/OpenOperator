services:
  maccomputer:
    image: dockurr/macos
    container_name: maccomputer
    environment:
      VERSION: "15"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8007:8006
      - 5900:5900/tcp
      - 5900:5900/udp
    volumes:
      - ./storage:/storage
    restart: always
    stop_grace_period: 2m