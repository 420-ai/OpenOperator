services:
  windowscomputer:
    container_name: windowscomputer
    image: lukaskellerstein/windows-computer:0.0.4
    environment:
      RAM_SIZE: "4G"
      CPU_CORES: "2"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389/tcp
      - 3389:3389/udp
      - 5051:5051
      - 5052:5052
      - 5053:5053
      - 4723:4723
      - 5056:5056
      - 8003:8003
      - 8931:8931
      - 9222:9222
    volumes:
      - ./iso/Win11_24H2_English_x64.iso:/custom.iso
      - ./scripts:/oem
      - ./data:/data
      - ./storage:/storage
      - ../../../servers/server_browser_control:/data/server_browser_control
      - ../../../servers/server_evaluator:/data/server_evaluator
      - ../../../servers/server_network_proxy:/data/server_network_proxy
      - ../../../servers/server_appium:/data/server_appium
      - ../../../servers/server_teams_control:/data/server_teams_control
      - ../../../servers/mcp_computer_control:/data/mcp_computer_control
      - ../../../servers/mcp_playwright_direct:/data/mcp_playwright_direct
    restart: no
    stop_grace_period: 2m